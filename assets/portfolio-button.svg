<svg xmlns="http://www.w3.org/2000/svg" width="280" height="60" viewBox="0 0 280 60" role="img" aria-label="Open my portfolio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#7ee787;#d2a8ff;#58a6ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#d2a8ff">
        <animate attributeName="stop-color" values="#d2a8ff;#58a6ff;#7ee787;#d2a8ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1.5" y="1.5" width="277" height="57" rx="14"/>
    </clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="277" height="57" rx="14" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect x="-80" y="0" width="80" height="60" fill="url(#shine)">
      <animate attributeName="x" values="-80;280" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="30" cy="30" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="30" r="5" fill="none" stroke="#3fb950" stroke-width="1.5">
    <animate attributeName="r" values="5;12" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text x="50" y="36" fill="#e6edf3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Open My Portfolio</text>

  <text x="244" y="37" fill="#58a6ff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700">↗
    <animateTransform attributeName="transform" type="translate" values="0,0;3,-3;0,0" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
